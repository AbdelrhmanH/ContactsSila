name: Sila KMP CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-architecture-and-tests:
    name: Architecture Boundaries, Unit Tests & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Clean Architecture & Privacy Boundaries
        run: ./gradlew checkArchitectureBoundaries --console=plain

      - name: Run All KMP Host Unit Tests (Core + Features + SharedLogic + Android App)
        run: >-
          ./gradlew
          :core:common:testAndroidHostTest
          :core:model:testAndroidHostTest
          :core:database:testAndroidHostTest
          :core:datastore:testAndroidHostTest
          :feature:contacts:domain:testAndroidHostTest
          :feature:contacts:data:testAndroidHostTest
          :feature:arham:data:testAndroidHostTest
          :feature:services:data:testAndroidHostTest
          :feature:settings:data:testAndroidHostTest
          :sharedLogic:testAndroidHostTest
          :androidApp:testDebugUnitTest
          --console=plain

      - name: Assemble Android Debug & Release APK (ProGuard/R8 Check)
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --console=plain

  verify-ios:
    name: iOS Simulator Tests, SKIE Framework & App Build
    # Toolchain alignment (T4 verification cycle): Kotlin 2.4.20 maps to the
    # Xcode 26.4 compatibility line and SKIE 0.10.15 supports Kotlin 2.4.20.
    # Xcode 26.4.1 is selected explicitly because the runner's default Xcode
    # (currently 26.6) changes independently of this workflow. Every iOS step
    # below (Kotlin/Native, SKIE, XCTest, app build) uses the same selected
    # installation via DEVELOPER_DIR + xcode-select.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and verify Xcode 26.4.1
        run: |
          set -euo pipefail

          XCODE_DEVELOPER_DIR="/Applications/Xcode_26.4.1.app/Contents/Developer"

          if [[ ! -d "$XCODE_DEVELOPER_DIR" ]]; then
            echo "::error::Expected Xcode installation not found: $XCODE_DEVELOPER_DIR"
            ls -la /Applications
            exit 1
          fi

          sudo xcode-select --switch "$XCODE_DEVELOPER_DIR"

          echo "Selected Xcode:"
          xcodebuild -version
          echo "Selected Developer Directory:"
          xcode-select -p
          echo "Selected iOS Simulator SDK:"
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "Available SDKs:"
          xcodebuild -showsdks
          echo "Available Simulator Runtimes:"
          xcrun simctl list runtimes
          echo "Available Simulator Devices:"
          xcrun simctl list devices available

          ACTUAL_XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 {print $2}')"
          if [[ "$ACTUAL_XCODE_VERSION" != "26.4.1" ]]; then
            echo "::error::Expected Xcode 26.4.1 but found $ACTUAL_XCODE_VERSION"
            exit 1
          fi

          ACTUAL_DEVELOPER_DIR="$(xcode-select -p)"
          if [[ "$ACTUAL_DEVELOPER_DIR" != "$XCODE_DEVELOPER_DIR" ]]; then
            echo "::error::xcode-select points to an unexpected Developer directory"
            exit 1
          fi

          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::DEVELOPER_DIR does not point to a valid Xcode installation"
            exit 1
          fi

          [ "$(uname -m)" = "arm64" ] || { echo "Expected arm64 macOS runner"; exit 1; }
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kotlin/Native Database Adoption Tests (PR B — ADR-0011)
        run: ./gradlew :core:database:iosSimulatorArm64Test --console=plain

      - name: Run Kotlin/Native iOS Simulator Tests (SharedLogic)
        run: ./gradlew :sharedLogic:iosSimulatorArm64Test --console=plain

      - name: Generate SKIE Framework & Link (Debug Simulator)
        run: ./gradlew :sharedLogic:linkDebugFrameworkIosSimulatorArm64 --console=plain

      - name: Build SwiftUI Simulator App (Debug, No Code Signing)
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath iosApp/build/dd
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Verify Effective iOS Privacy Config (F-03)
        run: |
          APP="iosApp/build/dd/Build/Products/Debug-iphonesimulator/ContactsSila.app"
          [ -d "$APP" ] || { echo "Built app bundle not found at $APP"; exit 1; }
          USAGE_DESC="$(plutil -extract NSContactsUsageDescription raw "$APP/Info.plist")" \
            || { echo "NSContactsUsageDescription missing in the BUILT Info.plist"; exit 1; }
          [ -n "$USAGE_DESC" ] || { echo "NSContactsUsageDescription is empty in the BUILT Info.plist"; exit 1; }
          echo "NSContactsUsageDescription (built bundle): $USAGE_DESC"
          for LPROJ in en ar; do
            [ -f "$APP/$LPROJ.lproj/InfoPlist.strings" ] \
              || { echo "Missing $LPROJ.lproj/InfoPlist.strings in the built bundle"; exit 1; }
            grep -q "NSContactsUsageDescription" "$APP/$LPROJ.lproj/InfoPlist.strings" \
              || { echo "$LPROJ InfoPlist.strings lacks NSContactsUsageDescription"; exit 1; }
          done
          echo "F-03 verified: contacts usage description present in the effective bundle (en + ar)."

      - name: Restore headers into embedded testing frameworks (Xcode 26)
        run: |
          set -euo pipefail

          # Xcode 26 embeds the testing frameworks into the host app during
          # the test action with `builtin-copy -exclude Headers -exclude
          # Modules` (runtime-only embeds, by design). The test bundle's
          # compile-time framework search includes the app's Frameworks dir
          # (injected for the TEST_HOST dependency) and resolves XCTest/
          # XCUIAutomation there first; their header-less copies break the
          # Clang module build required by XCTest's textual swiftinterface
          # ("did not find header 'XCTestCore.h' in framework 'XCTest'"
          # (loaded from .../ContactsSila.app/Frameworks)").
          #
          # Fix: pre-create the Frameworks dir (it does not exist after the
          # plain build step - the embed happens inside the test action) and
          # place the FULL framework bundles (headers + modules) from the
          # same selected Xcode there before the test action runs. The embed
          # phase then finds fresh full bundles (its copy list excludes
          # Headers/Modules and does not delete extra content), overwriting
          # the runtime binaries identically at most. Module resolution
          # succeeds on byte-identical content from the same toolchain;
          # runtime loading is unchanged; no test is skipped or weakened;
          # pbxproj is untouched.
          APP_DIR="iosApp/build/dd/Build/Products/Debug-iphonesimulator/ContactsSila.app"
          APP_FW="$APP_DIR/Frameworks"
          DEV_FW="$(xcrun --sdk iphonesimulator --show-sdk-platform-path)/Developer/Library/Frameworks"

          [ -d "$DEV_FW" ] || { echo "::error::Developer frameworks dir not found: $DEV_FW"; exit 1; }
          [ -d "$APP_DIR" ] || { echo "::error::App bundle not found: $APP_DIR (build step products missing?)"; exit 1; }
          mkdir -p "$APP_FW"

          for SRC in "$DEV_FW"/*.framework; do
            FW="$(basename "$SRC")"
            rm -rf "$APP_FW/$FW"
            cp -R "$SRC" "$APP_FW/$FW"
            echo "restored full bundle: $FW"
          done
          ls -la "$APP_FW"

      - name: Swift Unit Tests - Contacts Binding (T4 - Issue #25)
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -derivedDataPath iosApp/build/dd
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          SWIFT_ENABLE_EXPLICIT_MODULES=NO
          test

      - name: Upload Kotlin/Native Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-reports
          path: |
            core/database/build/test-results/
            core/database/build/reports/tests/
            feature/contacts/data/build/test-results/
            feature/contacts/data/build/reports/tests/
            sharedLogic/build/test-results/
            sharedLogic/build/reports/tests/
          if-no-files-found: ignore
