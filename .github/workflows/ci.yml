name: Sila KMP CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-architecture-and-tests:
    name: Architecture Boundaries, Unit Tests & Debug APK
    runs-on: ubuntu-latest
    # رفع السقف من 30 إلى 40: خطوة التجميع أضافت بناء AAB وموديول القياس (:benchmark
    # مع R8 ثانٍ لبنية benchmark) وخطوة الاختبارات أضافت أربع مهام مضيفة سابقة الغياب.
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Clean Architecture & Privacy Boundaries
        run: ./gradlew checkArchitectureBoundaries --console=plain

      - name: Detekt (pinned CLI, baseline ratchet + settings-decomposition floor)
        run: |
          DETEKT_JAR="$RUNNER_TEMP/detekt-cli-2.0.0-alpha.6.jar"
          DETEKT_SHA256="d46ca62ea4d62769b5d5c3ba94d49fa9b80ba11c7dba74ddb6df7fcc2c19c5fd"
          curl -fsSL -o "$DETEKT_JAR" "https://repo1.maven.org/maven2/dev/detekt/detekt-cli/2.0.0-alpha.6/detekt-cli-2.0.0-alpha.6-all.jar"
          echo "$DETEKT_SHA256  $DETEKT_JAR" | sha256sum -c -
          java -jar "$DETEKT_JAR" \
            --config config/detekt/detekt.yml \
            --input . \
            --excludes "**/build/**,**/generated/**" \
            --baseline config/detekt/baseline.xml
          # Hard floor for the S2-17 decomposition: settings UI files must never
          # again carry frozen complexity debt (LongMethod / CCM / TooManyFunctions)
          # in the baseline — new debt must be fixed inline, not ratcheted.
          if grep -Eq "(LongMethod|CyclomaticComplexMethod|TooManyFunctions):(SettingsScreen|SettingsStrings|SettingsSections|SettingsDialogs|SettingsSectionPreviews|SettingsContentDialogsPreviews)\.kt:" config/detekt/baseline.xml; then
            echo "::error::Settings UI files carry frozen complexity debt in the baseline — decomposition floor violated"
            exit 1
          fi

      - name: Run All KMP Host Unit Tests (Core + Features + SharedLogic + SharedUI + Android App)
        run: >-
          ./gradlew
          :core:common:testAndroidHostTest
          :core:model:testAndroidHostTest
          :core:database:testAndroidHostTest
          :core:datastore:testAndroidHostTest
          :feature:contacts:domain:testAndroidHostTest
          :feature:contacts:data:testAndroidHostTest
          :feature:contacts:presentation:testAndroidHostTest
          :feature:arham:domain:testAndroidHostTest
          :feature:arham:data:testAndroidHostTest
          :feature:arham:presentation:testAndroidHostTest
          :feature:services:data:testAndroidHostTest
          :feature:settings:data:testAndroidHostTest
          :feature:settings:domain:testAndroidHostTest
          :feature:settings:presentation:testAndroidHostTest
          :sharedLogic:testAndroidHostTest
          :sharedUI:testAndroidHostTest
          :androidApp:testDebugUnitTest
          --console=plain

      - name: Prepare release signing from CI secrets (guarded — absent secrets keep the fallback)
        # ADR-0020: فك ترميز keystore الإنتاج إلى RUNNER_TEMP (خارج المستودع) حصراً حين
        # يوجد السر — لا مفتاح في المستودع أبداً، وبلا أسرار تبقى الحزم debug-fallback كما هي.
        # سياق secrets غير متاح في if الخاص بالخطوة (قيود GitHub)، لذا الحرس داخل السكربت:
        # غياب السر يعني الخروج مبكراً دون كتابة أي متغير إلى GITHUB_ENV.
        env:
          SILA_RELEASE_KEYSTORE_BASE64: ${{ secrets.SILA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SILA_RELEASE_KEYSTORE_BASE64" ]; then
            echo "SILA release secrets absent — keeping debug-fallback signing (ADR-0020)"
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/sila-release.keystore"
          echo "$SILA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "SILA_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Assemble Debug & Release APK (R8 Check) + Release AAB Path + Benchmark Harness
        # ADR-0020: متغيرات توقيع الإنتاج تُمرَّر للبناء — أسرار غائبة = قيم فارغة =
        # hasReleaseSigning=false في build.gradle.kts = الوضع الراهن بلا تغيير.
        env:
          SILA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SILA_RELEASE_KEYSTORE_PASSWORD }}
          SILA_RELEASE_KEY_ALIAS: ${{ secrets.SILA_RELEASE_KEY_ALIAS }}
          SILA_RELEASE_KEY_PASSWORD: ${{ secrets.SILA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease :androidApp:bundleRelease :androidApp:assembleBenchmark :benchmark:assembleBenchmark --console=plain

  verify-ios:
    name: iOS Simulator Tests, SKIE Framework & App Build
    # Toolchain alignment (T4 verification cycle): Kotlin 2.4.20 maps to the
    # Xcode 26.4 compatibility line and SKIE 0.10.15 supports Kotlin 2.4.20.
    # Xcode 26.4.1 is selected explicitly because the runner's default Xcode
    # (currently 26.6) changes independently of this workflow. Every iOS step
    # below (Kotlin/Native, SKIE, XCTest, app build) uses the same selected
    # installation via DEVELOPER_DIR + xcode-select.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and verify Xcode 26.4.1
        run: |
          set -euo pipefail

          XCODE_DEVELOPER_DIR="/Applications/Xcode_26.4.1.app/Contents/Developer"

          if [[ ! -d "$XCODE_DEVELOPER_DIR" ]]; then
            echo "::error::Expected Xcode installation not found: $XCODE_DEVELOPER_DIR"
            ls -la /Applications
            exit 1
          fi

          sudo xcode-select --switch "$XCODE_DEVELOPER_DIR"

          echo "Selected Xcode:"
          xcodebuild -version
          echo "Selected Developer Directory:"
          xcode-select -p
          echo "Selected iOS Simulator SDK:"
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "Available SDKs:"
          xcodebuild -showsdks
          echo "Available Simulator Runtimes:"
          xcrun simctl list runtimes
          echo "Available Simulator Devices:"
          xcrun simctl list devices available

          ACTUAL_XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 {print $2}')"
          if [[ "$ACTUAL_XCODE_VERSION" != "26.4.1" ]]; then
            echo "::error::Expected Xcode 26.4.1 but found $ACTUAL_XCODE_VERSION"
            exit 1
          fi

          ACTUAL_DEVELOPER_DIR="$(xcode-select -p)"
          if [[ "$ACTUAL_DEVELOPER_DIR" != "$XCODE_DEVELOPER_DIR" ]]; then
            echo "::error::xcode-select points to an unexpected Developer directory"
            exit 1
          fi

          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::DEVELOPER_DIR does not point to a valid Xcode installation"
            exit 1
          fi

          [ "$(uname -m)" = "arm64" ] || { echo "Expected arm64 macOS runner"; exit 1; }
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kotlin/Native Database Adoption Tests (PR B — ADR-0011)
        run: ./gradlew :core:database:iosSimulatorArm64Test --console=plain

      - name: Run Kotlin/Native iOS Simulator Tests (SharedLogic)
        run: ./gradlew :sharedLogic:iosSimulatorArm64Test --console=plain

      - name: Generate SKIE Framework & Link (Debug Simulator)
        run: ./gradlew :sharedLogic:linkDebugFrameworkIosSimulatorArm64 --console=plain

      - name: Build SwiftUI Simulator App (Debug, No Code Signing)
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath iosApp/build/dd
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Verify Effective iOS Privacy Config (F-03)
        run: |
          APP="iosApp/build/dd/Build/Products/Debug-iphonesimulator/ContactsSila.app"
          [ -d "$APP" ] || { echo "Built app bundle not found at $APP"; exit 1; }
          USAGE_DESC="$(plutil -extract NSContactsUsageDescription raw "$APP/Info.plist")" \
            || { echo "NSContactsUsageDescription missing in the BUILT Info.plist"; exit 1; }
          [ -n "$USAGE_DESC" ] || { echo "NSContactsUsageDescription is empty in the BUILT Info.plist"; exit 1; }
          echo "NSContactsUsageDescription (built bundle): $USAGE_DESC"
          for LPROJ in en ar; do
            [ -f "$APP/$LPROJ.lproj/InfoPlist.strings" ] \
              || { echo "Missing $LPROJ.lproj/InfoPlist.strings in the built bundle"; exit 1; }
            grep -q "NSContactsUsageDescription" "$APP/$LPROJ.lproj/InfoPlist.strings" \
              || { echo "$LPROJ InfoPlist.strings lacks NSContactsUsageDescription"; exit 1; }
          done
          echo "F-03 verified: contacts usage description present in the effective bundle (en + ar)."

      - name: Stage full testing frameworks for compile-time resolution (Xcode 26)
        run: |
          set -euo pipefail

          # Xcode 26 embeds the testing frameworks into the host app during
          # the test action with `builtin-copy -exclude Headers -exclude
          # Modules` (runtime-only embeds, by design), REPLACING any existing
          # bundle at the destination (CI run 41436508752 proved this: a
          # pre-placed full XCTest.framework was wiped by the embed's "Copy"
          # step). The test bundle's compile-time framework search resolves
          # XCTest/XCUIAutomation to those header-less embedded copies first
          # (the TEST_HOST Frameworks dir is dependency-injected into the -F
          # order), which breaks the Clang module build required by XCTest's
          # textual swiftinterface: "did not find header 'XCTestCore.h' in
          # framework 'XCTest' (loaded from .../ContactsSila.app/Frameworks)".
          #
          # Fix: stage the FULL framework bundles (headers + modules) from
          # the same selected Xcode into a NEUTRAL directory that the embed
          # phase never touches, and put that directory FIRST on the test
          # invocation's framework search path (next step). Framework-
          # qualified imports then resolve to the complete bundles;
          # byte-identical content from the same toolchain. Runtime loading
          # is unchanged (the app's embedded copies stay in place and load
          # via rpath); no test is skipped or weakened; pbxproj untouched.
          STAGE_DIR="iosApp/build/full-test-frameworks"
          DEV_FW="$(xcrun --sdk iphonesimulator --show-sdk-platform-path)/Developer/Library/Frameworks"

          [ -d "$DEV_FW" ] || { echo "::error::Developer frameworks dir not found: $DEV_FW"; exit 1; }

          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          for SRC in "$DEV_FW"/*.framework; do
            cp -R "$SRC" "$STAGE_DIR/$(basename "$SRC")"
            echo "staged full bundle: $(basename "$SRC")"
          done
          ls "$STAGE_DIR"

      - name: Swift Unit Tests - Contacts Binding (T4 - Issue #25)
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -derivedDataPath iosApp/build/dd
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          SWIFT_ENABLE_EXPLICIT_MODULES=NO
          FRAMEWORK_SEARCH_PATHS="$PWD/iosApp/build/full-test-frameworks \$(inherited)"
          test

      - name: Upload Kotlin/Native Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-reports
          path: |
            core/database/build/test-results/
            core/database/build/reports/tests/
            feature/contacts/data/build/test-results/
            feature/contacts/data/build/reports/tests/
            sharedLogic/build/test-results/
            sharedLogic/build/reports/tests/
          if-no-files-found: ignore
