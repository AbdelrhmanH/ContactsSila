name: Sila KMP CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-architecture-and-tests:
    name: Architecture Boundaries, Unit Tests & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Clean Architecture & Privacy Boundaries
        run: ./gradlew checkArchitectureBoundaries --console=plain

      - name: Run All KMP Host Unit Tests (Core + Features + SharedLogic)
        run: >-
          ./gradlew
          :core:common:testAndroidHostTest
          :core:model:testAndroidHostTest
          :core:database:testAndroidHostTest
          :core:datastore:testAndroidHostTest
          :feature:contacts:domain:testAndroidHostTest
          :feature:contacts:data:testAndroidHostTest
          :feature:arham:data:testAndroidHostTest
          :feature:services:data:testAndroidHostTest
          :feature:settings:data:testAndroidHostTest
          :sharedLogic:testAndroidHostTest
          --console=plain

      - name: Assemble Android Debug & Release APK (ProGuard/R8 Check)
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --console=plain

  verify-ios:
    name: iOS Simulator Tests, SKIE Framework & App Build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify macOS Runner Environment (Arm64 + Xcode 16.2 Pinning)
        run: |
          [ "$(uname -m)" = "arm64" ] || { echo "Expected arm64 macOS runner"; exit 1; }
          [ -d "/Applications/Xcode_16.2.app" ] || { echo "Required /Applications/Xcode_16.2.app not found"; exit 1; }
          sudo xcode-select -s /Applications/Xcode_16.2.app
          uname -m
          xcode-select -p
          xcodebuild -version | grep -q "Xcode 16.2" || { echo "xcodebuild output did not contain 'Xcode 16.2' after pinning"; exit 1; }
          xcodebuild -version
          swift --version
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kotlin/Native iOS Simulator Tests (SharedLogic)
        run: ./gradlew :sharedLogic:iosSimulatorArm64Test --console=plain

      - name: Generate SKIE Framework & Link (Debug Simulator)
        run: ./gradlew :sharedLogic:linkDebugFrameworkIosSimulatorArm64 --console=plain

      - name: Build SwiftUI Simulator App (Debug, No Code Signing)
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build
