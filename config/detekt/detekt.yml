# Sila Static Analysis Configuration (Detekt) — مرجع: docs/CODING_GUIDELINES.md
#
# مخطط detekt 2.0 (dev.detekt 2.0.0-alpha.6). لا قسم «build/maxIssues» في هذا
# الإصدار — مفهوم العتبة الإجمالية استُبدل بـ `--fail-on-severity` (الافتراضي Error)
# في سطر أوامر المُشغِّل (خطوة CLI المثبتة في CI)، فأي مخالفة واحدة تفشل الخطوة.
#
# نزاهة LongMethod (تذكرة #67): الحد يسري على الدوال المركِّبة `@Composable`
# حصراً بلا استثناء حسب التعليق التوضيحي — الشاشة العملاقة تُفكَّك إلى وحدات
# أصغر بدل تغيير الحد أو استثنائها صامتاً.
config:
  validation: true
  warningsAsErrors: true

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 15
  LongMethod:
    active: true
    allowedLines: 60
  LongParameterList:
    active: true
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
    ignoreAnnotatedParameter: ['Composable']
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 15

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true # يمنع استخدام !! طبقاً لـ CODING_GUIDELINES.md §1

style:
  active: true
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
  WildcardImport:
    active: true
